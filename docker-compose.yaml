services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moneyquest
      POSTGRES_USER: moneyquest
      POSTGRES_PASSWORD: moneyquest
    ports:
      - "5432:5432"
    volumes:
      - moneyquest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyquest -d moneyquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/moneyquest
      DATABASE_USERNAME: moneyquest
      DATABASE_PASSWORD: moneyquest
      MONEYQUEST_JWT_SECRET: change-this-in-production
    ports:
      - "8080:8080"

volumes:
  moneyquest-pgdata:
    name: moneyquest-pgdata
