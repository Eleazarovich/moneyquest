spring:
  application:
    name: moneyquest-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  packages-to-scan: com.moneyquest.api
  paths-to-match: /api/**

moneyquest:
  jwt:
    secret: ${MONEYQUEST_JWT_SECRET:change-this-development-secret-to-a-long-random-value-at-least-32-bytes}
    expiration: ${MONEYQUEST_JWT_EXPIRATION:PT12H}
  cors:
    allowed-origins: ${MONEYQUEST_CORS_ORIGINS:http://localhost:3000,http://localhost:4028,http://127.0.0.1:3000,http://127.0.0.1:4028}
