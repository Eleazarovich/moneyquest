spring:
  application:
    name: moneyquest-backend
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/moneyquest.db}
    driver-class-name: ${DATABASE_DRIVER:org.sqlite.JDBC}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

moneyquest:
  jwt:
    secret: ${MONEYQUEST_JWT_SECRET:change-this-development-secret-to-a-long-random-value-at-least-32-bytes}
    expiration: ${MONEYQUEST_JWT_EXPIRATION:PT12H}
  cors:
    allowed-origins: ${MONEYQUEST_CORS_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/moneyquest}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:moneyquest}
    password: ${DATABASE_PASSWORD:moneyquest}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
