spring:
  application:
    name: moneyquest-backend
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/moneyquest.db}
    driver-class-name: ${DATABASE_DRIVER:org.sqlite.JDBC}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  packages-to-scan: com.moneyquest.api
  paths-to-match: /api/**

moneyquest:
  jwt:
    secret: ${MONEYQUEST_JWT_SECRET:change-this-development-secret-to-a-long-random-value-at-least-32-bytes}
    expiration: ${MONEYQUEST_JWT_EXPIRATION:PT12H}
  cors:
    allowed-origins: ${MONEYQUEST_CORS_ORIGINS:http://localhost:3000,http://localhost:4028,http://127.0.0.1:3000,http://127.0.0.1:4028}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/moneyquest}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:moneyquest}
    password: ${DATABASE_PASSWORD:moneyquest}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
